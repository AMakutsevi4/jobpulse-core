spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobpulse}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}

  jpa:
    database: POSTGRESQL
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    root: debug

liquibase:
  drop-first: ${LIQUIBASE_DROP_FIRST:false}